name: Build Windows Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name MonsterTamer `
            --add-data "data;data" `
            main.py

      - name: Zip build output
        run: |
          Compress-Archive -Path dist\MonsterTamer.exe -DestinationPath dist\MonsterTamer-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonsterTamer-Windows
          path: dist\MonsterTamer-Windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\MonsterTamer-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
